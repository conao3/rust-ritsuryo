<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ritsuryo</title>
    <meta
      name="description"
      content="日本の法令の期間と税額の計算を、条文どおりと証明された Lean 4 のコードでブラウザの中だけで計算する"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d74ce'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='sans-serif'%3E律%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>ritsuryo</h1>
      <p class="lead">
        日本の法令の期間と税額を、条文どおりに計算すると証明された Lean 4 のコードで計算します。Lean のコードを
        Rust に変換して WebAssembly にしたものが、このブラウザの中だけで動きます。入力はどこにも送りません。
      </p>
      <p class="links">
        <a href="https://github.com/conao3/lean-ritsuryo">lean-ritsuryo</a>
        <a href="https://github.com/conao3/lean-rs">lean-rs</a>
        <a href="https://github.com/conao3/rust-ritsuryo">rust-ritsuryo</a>
      </p>
    </header>

    <main>
      <section class="panel" aria-labelledby="form-title">
        <h2 id="form-title" class="visually-hidden">計算</h2>
        <div class="pickers">
          <label>
            <span>コマンド</span>
            <select id="command"></select>
          </label>
          <label>
            <span>サブコマンド</span>
            <select id="subcommand"></select>
          </label>
        </div>
        <p id="help" class="help"></p>
        <form id="form" novalidate>
          <div id="params" class="params"></div>
          <div class="actions">
            <fieldset class="segmented" aria-label="出力の形式">
              <label><input type="radio" name="output" value="table" checked /> 表</label>
              <label><input type="radio" name="output" value="json" /> JSON</label>
              <label><input type="radio" name="output" value="text" /> テキスト</label>
            </fieldset>
            <button type="submit" id="run" disabled>計算する</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="result-title">
        <div class="result-head">
          <h2 id="result-title">結果</h2>
          <code id="cli" class="cli"></code>
        </div>
        <p id="status" class="status" role="status">WebAssembly を読み込んでいます…</p>
        <pre id="result" class="result" hidden></pre>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
