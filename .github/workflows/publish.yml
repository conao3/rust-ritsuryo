name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (vX.Y.Z)
        required: true
        type: string

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
    environment:
      name: crates.io
      url: https://crates.io/crates/ritsuryo
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: cachix/install-nix-action@v31.11.3
      - run: nix develop -c cargo publish -p ritsuryo --dry-run
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth
      - run: nix develop -c cargo publish -p ritsuryo
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
